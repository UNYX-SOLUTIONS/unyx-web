server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;


    # ==========================================
    # ASTRO ROUTES
    # ==========================================

    location / {
        try_files $uri $uri/ $uri.html =404;
    }


    # ==========================================
    # ASTRO ASSETS
    # ==========================================

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    # ==========================================
    # STATIC ASSETS
    # ==========================================

    location ~* \.(png|jpg|jpeg|gif|svg|webp|avif|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }


    # ==========================================
    # SECURITY
    # ==========================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # ==========================================
    # COMPRESSION
    # ==========================================

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;
}